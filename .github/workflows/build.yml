name: build-launcher
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        working-directory: launcher
        run: ./gradlew assembleRelease -q --console=plain
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create tv1 launcher/app/build/outputs/apk/release/app-release.apk --title tv1 --notes launcher
